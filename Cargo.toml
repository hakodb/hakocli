[package]
name = "firelite-cli"
version = "0.2.1"
edition = "2021"
description = "Command-line manager for the FireLite embedded document engine"

[features]
default = ["net-sync", "cloud-sync"]
net-sync = ["firelite/net-sync"]
cloud-sync = ["firelite/cloud-sync"]

[dependencies]
# Pinned to the firelite core branch until the first crates.io release,
# then switch to `version = "0.8"`.
firelite = { git = "https://github.com/rizaptk/firelite.git", branch = "cloud_sync" }
serde_json = "1.0"
clap = { version = "4.6.0", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
rustyline = "14.0"
shlex = "1.3"
