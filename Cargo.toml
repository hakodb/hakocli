[package]
name = "hakocli"
version = "0.2.1"
edition = "2021"
description = "Command-line manager for the HakoDB embedded document engine"
license = "MIT"

[features]
default = ["net-sync", "cloud-sync"]
net-sync = ["hakodb/net-sync"]
cloud-sync = ["hakodb/cloud-sync"]

[dependencies]
# Core from crates.io (publishable). Sync wires through the
# net-sync/cloud-sync features below.
hakodb = { version = "0.8.23" }
serde_json = "1.0"
clap = { version = "4.6.0", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
rustyline = "14.0"
shlex = "1.3"
